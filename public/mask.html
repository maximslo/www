<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Maxim Slobodchikov</title>
		<style>
			:root {
				--paper: #fbfbf9;
				--ink: #1a1a1a;
				--muted: #6b6b6b;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				background: var(--paper);
				color: var(--ink);
				font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
				display: flex;
				justify-content: center;
				padding: 3rem 1.5rem 4rem;
			}
			.home {
				width: 100%;
				max-width: 680px;
			}
			nav {
				display: flex;
				gap: 1.5rem;
				font-size: 0.9rem;
				margin-bottom: 3.5rem;
			}
			nav a {
				color: var(--muted);
				text-decoration: none;
			}
			nav a:hover,
			nav a.active {
				color: var(--ink);
			}
			nav a.active {
				font-weight: 600;
			}
			#stage {
				width: 100%;
			}
			#stage canvas {
				display: block;
			}
			.name {
				font-weight: 400;
				font-size: 2rem;
				line-height: 1.25;
				letter-spacing: -0.03em;
				color: var(--muted);
				margin: -0.1rem 0 0;
			}
			.bio {
				color: var(--muted);
				font-size: 1.05rem;
				margin: 1.25rem 0 1.25rem;
				max-width: 55ch;
			}
			.links {
				font-size: 0.9rem;
				margin: 0;
			}
			.links a {
				color: var(--muted);
				text-decoration: none;
				margin-right: 1.5rem;
			}
			.links a::before {
				content: "↗";
				margin-right: 0.3rem;
				font-size: 1.15em;
				font-weight: 400;
				vertical-align: -0.11em;
			}
			.links a:hover {
				color: var(--ink);
			}
			/* visually hidden, but available to screen readers, search engines, and copy */
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				margin: -1px;
				padding: 0;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}
		</style>
	</head>
	<body>
		<div class="home">
			<nav>
				<a href="#" class="active">home</a>
				<a href="#">blog</a>
			</nav>

			<!-- decorative pixel rendering of "Maxim"; the real text lives in the heading -->
			<div id="stage" aria-hidden="true"></div>

			<h1 class="name"><span class="sr-only">Maxim </span>Slobodchikov</h1>

			<p class="bio">One line about you — what you build and what you're into.</p>
			<p class="links">
				<a href="#">linkedin</a>
				<a href="#">github</a>
				<a href="#">strava</a>
			</p>
		</div>

		<script type="module">
			// Pixel title baked inline (no image file). "#" = a block, "." = empty.
			// Edit these rows to change the wordmark.
			const ART = [
				"...................##........",
				".............................",
				"##..##.#####.##.#####.#.##.##",
				".##.##....##..####.##.#######",
				".#####..####..###..##.##.##.#",
				".#.#.#.##..#..###..##.##.##.#",
				".#...#.##.##.#####.##.##.##.#",
				"###.##.###.####..####.##.##.#",
			];
			const covW = ART[0].length, covH = ART.length;
			const covered = (col, row) =>
				row >= 0 && row < covH && col >= 0 && col < covW && ART[row][col] === "#";

			const PIXEL = 4.5; // css px per block
			const INK = "#6b6b6b"; // title color (matches --muted / Slobodchikov)
			const PAPER = "#fbfbf9"; // page background
			const GLYPHS = "&#@~%*+}:;?=$".split("");
			const GLYPH_COLORS = ["#ec9c8b", "#f0b98a", "#e58fa6", "#e9c46a", "#c9a6e0", "#f2a9a0"];

			const stage = document.getElementById("stage");
			stage.style.position = "relative";

			// static title canvas (in #stage) + hover-aura overlay (spans .home)
			const base = document.createElement("canvas");
			stage.appendChild(base);
			const bctx = base.getContext("2d");

			const overlay = document.createElement("canvas");
			overlay.style.cssText = "position:absolute; left:0; top:0; pointer-events:none; z-index:50; opacity:0;";
			stage.parentElement.style.position = "relative";
			stage.parentElement.appendChild(overlay);
			overlay.setAttribute("aria-hidden", "true"); // decorative
			const octx = overlay.getContext("2d");

			let blockCss = 1, pxDev = 1; // css / device px per block
			let gx = 0, gy = 0, ovW = 0, ovH = 0; // title offset + overlay size within .home
			let dpr = Math.min(window.devicePixelRatio || 1, 2);

			function hash(c, r) {
				let h = (c * 374761393 + r * 668265263) >>> 0;
				h = Math.imul(h ^ (h >>> 13), 1274126177);
				return (h ^ (h >>> 16)) >>> 0;
			}

			function layout() {
				dpr = Math.min(window.devicePixelRatio || 1, 2); // handles browser zoom

				// integer device px per block -> crisp, and overlay aligns to the grid
				pxDev = Math.max(1, Math.round(PIXEL * dpr));
				blockCss = pxDev / dpr;
				const W = covW * blockCss, H = covH * blockCss;

				base.style.width = W + "px";
				base.style.height = H + "px";
				base.width = covW * pxDev;
				base.height = covH * pxDev;
				drawBase();

				// overlay spans the whole .home column; record the title's offset
				const hr = stage.parentElement.getBoundingClientRect();
				const cr = base.getBoundingClientRect();
				gx = cr.left - hr.left; gy = cr.top - hr.top;
				ovW = hr.width; ovH = hr.height;
				overlay.style.width = ovW + "px";
				overlay.style.height = ovH + "px";
				overlay.width = Math.round(ovW * dpr);
				overlay.height = Math.round(ovH * dpr);
				octx.setTransform(dpr, 0, 0, dpr, 0, 0);
				if (hoverAmt > 0.01) drawAura(performance.now() / 1000);
			}

			function drawBase() {
				bctx.setTransform(1, 0, 0, 1, 0, 0);
				bctx.clearRect(0, 0, base.width, base.height);
				bctx.fillStyle = INK;
				for (let row = 0; row < covH; row++) {
					for (let col = 0; col < covW; col++) {
						if (covered(col, row)) bctx.fillRect(col * pxDev, row * pxDev, pxDev, pxDev);
					}
				}
			}

			// ---------- hover aura (loop runs only while active) ----------
			let hovering = false, hoverAmt = 0, running = false;

			function drawAura(t) {
				octx.clearRect(0, 0, ovW, ovH);
				if (hoverAmt <= 0.01) return;
				const cell = blockCss;
				octx.textAlign = "center";
				octx.textBaseline = "middle";
				octx.font = `700 ${(cell * 1.7).toFixed(1)}px ui-monospace, Menlo, monospace`;
				// (the whole overlay is faded via CSS opacity — no per-cell alpha to compound)
				for (let row = 0; row < covH; row++) {
					const cy = gy + (row + 0.5) * cell;
					for (let col = 0; col < covW; col++) {
						if (!covered(col, row)) continue;
						const cx = gx + (col + 0.5) * cell;
						const ph = Math.floor(t * 7 + (col + row) * 0.6); // shifts over time
						const h = hash(col * 7 + ph, row * 13);
						octx.fillStyle = PAPER; // erase the gray block...
						octx.fillRect(cx - cell / 2, cy - cell / 2, cell + 0.6, cell + 0.6);
						octx.fillStyle = GLYPH_COLORS[(h >>> 3) % GLYPH_COLORS.length];
						octx.fillText(GLYPHS[h % GLYPHS.length], cx, cy); // ...draw a glyph
					}
				}
				octx.globalAlpha = 1;
			}

			function tick(now) {
				hoverAmt += ((hovering ? 1 : 0) - hoverAmt) * 0.45;
				overlay.style.opacity = Math.min(1, hoverAmt * 1.3);
				drawAura(now / 1000);
				if (hovering || hoverAmt > 0.01) {
					requestAnimationFrame(tick);
				} else {
					running = false;
					overlay.style.opacity = 0;
					octx.clearRect(0, 0, ovW, ovH);
				}
			}
			function startLoop() { if (!running) { running = true; requestAnimationFrame(tick); } }

			// respect users who prefer reduced motion: skip the hover animation
			const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
			const onEnter = () => { if (!reduceMotion) { hovering = true; startLoop(); } };
			base.addEventListener("pointerenter", onEnter);
			base.addEventListener("pointermove", onEnter);
			base.addEventListener("pointerleave", () => { hovering = false; });

			// ---------- init ----------
			layout();
			window.addEventListener("resize", layout);
			(function watchDPR() {
				matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener(
					"change",
					() => { layout(); watchDPR(); },
					{ once: true },
				);
			})();
		</script>
	</body>
</html>
